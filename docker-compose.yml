services:
  db:
    image: postgres:16
    container_name: smartsavor-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: smartsavor
    ports:
      - "5432:5432"
    volumes:
      - smartsavor-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  smartsavor-pgdata:
