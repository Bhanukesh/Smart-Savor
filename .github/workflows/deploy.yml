# Student capstone deploy — copy to .github/workflows/deploy.yml in your repo.
#
# Every push to main: builds your Docker image IN Azure Container Registry
# (no Docker needed in the runner, no registry password anywhere), then points
# your Container App at the new image.
#
# Setup (once, done for you at onboarding): five repo VARIABLES (not secrets —
# none of these values are secret):
#   AZURE_CLIENT_ID        — your CI identity (id-gh-<you>)
#   AZURE_TENANT_ID        — d75a3b31-b6ea-4bc1-9a3c-f760e543f24e
#   AZURE_SUBSCRIPTION_ID  — da17b3c4-4654-42b9-8719-5be9df6afa9f
#   ACR_NAME               — the shared registry name
#   STUDENT                — your roster name (also your app + hostname)
name: deploy
on:
  push:
    branches: [main]

permissions:
  id-token: write   # OIDC token for azure/login — this is the whole auth story
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push image (in ACR)
        run: |
          # Clerk's publishable key isn't secret (it's designed to ship in the browser bundle),
          # so it's versioned here like any other build-time config, not a GitHub secret.
          az acr build --registry ${{ vars.ACR_NAME }} \
            --image ${{ vars.STUDENT }}/web:${{ github.sha }} \
            --build-arg NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=pk_test_Ym9zcy1saW9uZXNzLTk5LmNsZXJrLmFjY291bnRzLmRldiQ .

      - name: Sync app config
        run: |
          # Required: the app needs this to do anything with Claude at all.
          az containerapp secret set \
            --resource-group rg-students-platform \
            --name ca-${{ vars.STUDENT }} \
            --secrets anthropic-api-key="${{ secrets.ANTHROPIC_API_KEY }}"
          az containerapp update \
            --resource-group rg-students-platform \
            --name ca-${{ vars.STUDENT }} \
            --set-env-vars ANTHROPIC_API_KEY=secretref:anthropic-api-key

          # Dietitian auth (Clerk). Guarded the same way the old DEMO_DIETITIAN_PASSWORD sync
          # was: a missing secret must degrade to "dietitian sign-in is broken this run," never
          # block this step and take the whole deploy down with it (that's the exact failure
          # mode PR #13 fixed for the old password bootstrap — same lesson applies here).
          if [ -n "${{ secrets.CLERK_SECRET_KEY }}" ]; then
            az containerapp secret set \
              --resource-group rg-students-platform \
              --name ca-${{ vars.STUDENT }} \
              --secrets clerk-secret-key="${{ secrets.CLERK_SECRET_KEY }}"
            az containerapp update \
              --resource-group rg-students-platform \
              --name ca-${{ vars.STUDENT }} \
              --set-env-vars CLERK_SECRET_KEY=secretref:clerk-secret-key
          else
            echo "::warning::CLERK_SECRET_KEY secret not set — dietitian sign-in will fail this deploy."
          fi

          if [ -n "${{ secrets.CLERK_WEBHOOK_SIGNING_SECRET }}" ]; then
            az containerapp secret set \
              --resource-group rg-students-platform \
              --name ca-${{ vars.STUDENT }} \
              --secrets clerk-webhook-signing-secret="${{ secrets.CLERK_WEBHOOK_SIGNING_SECRET }}"
            az containerapp update \
              --resource-group rg-students-platform \
              --name ca-${{ vars.STUDENT }} \
              --set-env-vars CLERK_WEBHOOK_SIGNING_SECRET=secretref:clerk-webhook-signing-secret
          else
            echo "::warning::CLERK_WEBHOOK_SIGNING_SECRET secret not set — new dietitian sign-ups won't get linked to an account this deploy."
          fi

          # Patient invite signup — Google Sign-In and Twilio (SMS delivery + Verify OTP).
          # Same guarded pattern: each missing secret just disables its one feature (see
          # lib/sms.ts / lib/auth/googleOAuth.ts's own guards) instead of blocking deploy.
          if [ -n "${{ secrets.GOOGLE_CLIENT_ID }}" ] && [ -n "${{ secrets.GOOGLE_CLIENT_SECRET }}" ]; then
            az containerapp secret set \
              --resource-group rg-students-platform \
              --name ca-${{ vars.STUDENT }} \
              --secrets google-client-id="${{ secrets.GOOGLE_CLIENT_ID }}" google-client-secret="${{ secrets.GOOGLE_CLIENT_SECRET }}"
            az containerapp update \
              --resource-group rg-students-platform \
              --name ca-${{ vars.STUDENT }} \
              --set-env-vars GOOGLE_CLIENT_ID=secretref:google-client-id GOOGLE_CLIENT_SECRET=secretref:google-client-secret
          else
            echo "::warning::GOOGLE_CLIENT_ID/GOOGLE_CLIENT_SECRET not set — Google patient signup disabled this deploy."
          fi

          if [ -n "${{ secrets.TWILIO_ACCOUNT_SID }}" ] && [ -n "${{ secrets.TWILIO_AUTH_TOKEN }}" ]; then
            az containerapp secret set \
              --resource-group rg-students-platform \
              --name ca-${{ vars.STUDENT }} \
              --secrets twilio-account-sid="${{ secrets.TWILIO_ACCOUNT_SID }}" twilio-auth-token="${{ secrets.TWILIO_AUTH_TOKEN }}" twilio-phone-number="${{ secrets.TWILIO_PHONE_NUMBER }}" twilio-verify-service-sid="${{ secrets.TWILIO_VERIFY_SERVICE_SID }}"
            az containerapp update \
              --resource-group rg-students-platform \
              --name ca-${{ vars.STUDENT }} \
              --set-env-vars TWILIO_ACCOUNT_SID=secretref:twilio-account-sid TWILIO_AUTH_TOKEN=secretref:twilio-auth-token TWILIO_PHONE_NUMBER=secretref:twilio-phone-number TWILIO_VERIFY_SERVICE_SID=secretref:twilio-verify-service-sid
          else
            echo "::warning::TWILIO_ACCOUNT_SID/TWILIO_AUTH_TOKEN not set — invite SMS delivery and phone/OTP signup disabled this deploy."
          fi

      - name: Deploy to Container App
        run: |
          az containerapp update \
            --resource-group rg-students-platform \
            --name ca-${{ vars.STUDENT }} \
            --image ${{ vars.ACR_NAME }}.azurecr.io/${{ vars.STUDENT }}/web:${{ github.sha }}
